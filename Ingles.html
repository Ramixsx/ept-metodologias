<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>American English Space</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: radial-gradient(circle at top, #2a0052, #050012, #000000);
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            height: 100vh; 
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative; 
        }

        #speaker-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            cursor: pointer;
            transition: transform 0.2s;
            user-select: none;
            filter: drop-shadow(0 0 10px #00ffff);
        }
        #speaker-btn:hover {
            transform: scale(1.2);
        }
        #speaker-btn:active {
            transform: scale(0.9);
        }

        h1 {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            margin-top: 50px;
            z-index: 2; 
        }
        .container {
            max-width: 800px;
            width: 100%;
            z-index: 2;
        }
        .card {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid #8a2be2;
            border-radius: 10px;
            padding: 50px 20px;
            margin: 20px 0;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.3);
        }
        
        #text-container {
            display: inline-block;
        }

        .word {
            color: #00ffff;
            font-size: 36px;
            font-weight: bold;
            display: block;
            margin-bottom: 15px;
        }
        .translation {
            color: #d4a5ff;
            font-size: 22px;
        }
        .instruction {
            color: #aaaaaa;
            font-size: 16px;
            margin-top: 30px;
            font-style: italic;
        }

        .animacion-pop {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .star {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ffff, 0 0 20px #8a2be2;
            pointer-events: none; 
            z-index: 1;
            animation: flyStar 1s ease-out forwards;
        }

        @keyframes flyStar {
            0% { 
                transform: translate(0, 0) scale(1); 
                opacity: 1; 
            }
            100% { 
                transform: translate(var(--tx), var(--ty)) scale(0); 
                opacity: 0; 
            }
        }
    </style>
</head>
<body>
    <div id="speaker-btn" title="Escuchar pronunciación">🔊</div>

    <div class="container">
        <h1>🚀 American English Space</h1>
        <p>Aprende lo básico del inglés americano de forma rápida.</p>

        <div class="card">
            <div id="text-container">
                <span class="word" id="english-word">"What's up?"</span>
                <span class="translation" id="spanish-translation">¿Qué pasa? / ¿Qué tal?</span>
            </div>
        </div>

        <p class="instruction">✨ Presiona la barra ESPACIADORA para avanzar ✨</p>
    </div>

    <script>
        const ejemplos = [
            { word: "\"What's up?\"", translation: "¿Qué pasa? / ¿Qué tal?", cleanVoice: "What's up?" },
            { word: "\"Awesome\"", translation: "Increíble / Genial", cleanVoice: "Awesome" },
            { word: "\"I'm beat\"", translation: "Estoy muy cansado/a", cleanVoice: "I'm beat" },
            { word: "\"Hang out\"", translation: "Pasar el rato (con amigos)", cleanVoice: "Hang out" },
            { word: "\"Chill\"", translation: "Relajarse / Tranquilo", cleanVoice: "Chill" },
            { word: "\"My bad\"", translation: "Mi culpa / Mi error", cleanVoice: "My bad" },
            { word: "\"No worries\"", translation: "No te preocupes / De nada", cleanVoice: "No worries" },
            { word: "\"Catch up\"", translation: "Ponerse al día", cleanVoice: "Catch up" },
            { word: "\"It's a piece of cake\"", translation: "Es pan comido (muy fácil)", cleanVoice: "It's a piece of cake" },
            { word: "\"Never mind\"", translation: "Olvídalo / No importa", cleanVoice: "Never mind" },
            { word: "\"Sounds good\"", translation: "Me parece bien / Suena genial", cleanVoice: "Sounds good" },
            { word: "\"Bummer\"", translation: "Qué lástima / Qué decepción", cleanVoice: "Bummer" },
            { word: "\"I got you\"", translation: "Te entiendo / Yo te ayudo", cleanVoice: "I got you" },
            { word: "\"Take it easy\"", translation: "Tómatelo con calma", cleanVoice: "Take it easy" },
            { word: "\"See ya!\"", translation: "¡Nos vemos!", cleanVoice: "See ya!" }
        ];

        let indiceActual = 0;
        
        const textContainer = document.getElementById("text-container");
        const wordElement = document.getElementById("english-word");
        const translationElement = document.getElementById("spanish-translation");
        const speakerBtn = document.getElementById("speaker-btn");

        speakerBtn.addEventListener("click", function() {
            const fraseParaLeer = ejemplos[indiceActual].cleanVoice;
            const mensajeVoz = new SpeechSynthesisUtterance(fraseParaLeer);
            
            mensajeVoz.lang = 'en-US';
            mensajeVoz.rate = 0.9; 
            mensajeVoz.pitch = 1.1; 
            
            window.speechSynthesis.cancel(); 
            window.speechSynthesis.speak(mensajeVoz);
        });

        function explotarEstrellas() {
            for (let i = 0; i < 25; i++) {
                const star = document.createElement("div");
                star.classList.add("star");

                star.style.left = "50%";
                star.style.top = "50%";

                const tx = (Math.random() - 0.5) * 600 + "px";
                const ty = (Math.random() - 0.5) * 600 + "px";
                
                star.style.setProperty('--tx', tx);
                star.style.setProperty('--ty', ty);

                document.body.appendChild(star);

                setTimeout(() => {
                    star.remove();
                }, 1000);
            }
        }

        document.addEventListener("keydown", function(event) {
            if (event.code === "Space") {
                event.preventDefault(); 
                
                indiceActual++;
                if (indiceActual >= ejemplos.length) {
                    indiceActual = 0;
                }
                wordElement.innerText = ejemplos[indiceActual].word;
                translationElement.innerText = ejemplos[indiceActual].translation;

                textContainer.classList.remove("animacion-pop");
                void textContainer.offsetWidth; 
                textContainer.classList.add("animacion-pop");

                explotarEstrellas();
            }
        });
    </script>
</body>
</html>
